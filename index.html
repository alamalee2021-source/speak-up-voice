<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEAK UP - Mikrofon</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:40px auto;padding:20px;background:#f4f6fa;color:#182536}
  h1{font-size:20px;margin-bottom:20px;color:#142b48}
  #status{font-size:13px;color:#66758a;margin-bottom:12px;min-height:20px}
  #transcript{width:100%;height:220px;border:1px solid #d6dee8;border-radius:8px;padding:12px;font-size:16px;line-height:1.5;background:#fff;margin-bottom:16px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
  .btn-start{background:#142b48;color:#fff}
  .btn-stop{background:#b42318;color:#fff}
  .btn-send{background:#d6ad5c;color:#172b43}
  button:disabled{opacity:0.5;cursor:not-allowed}
  .hint{font-size:12px;color:#66758a;border-top:1px solid #e3e8ef;padding-top:12px}
</style>
</head>
<body>
<h1>🎙️ SPEAK UP - Mikrofon</h1>
<div id="status">Klik "Mulai Bicara" untuk mulai merekam.</div>
<textarea id="transcript" placeholder="Hasil ucapan akan muncul di sini..."></textarea>
<div class="btn-row">
  <button id="btnStart" class="btn-start" onclick="startRec()">Mulai Bicara</button>
  <button id="btnStop" class="btn-stop" onclick="stopRec()" disabled>Berhenti</button>
  <button id="btnSend" class="btn-send" onclick="copyToClipboard()" disabled>Kirim ke SPEAK UP</button>
</div>
<p class="hint">Setelah klik "Kirim ke SPEAK UP", teks akan disalin ke clipboard. Buka halaman SPEAK UP utama, lalu tempel (paste) ke kolom naskah.</p>

<script>
  let recognition = null;
  let finalText = '';

  function init() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) {
      document.getElementById('status').textContent = 'Browser tidak mendukung pengenalan suara.';
      return false;
    }
    recognition = new SpeechAPI();
    recognition.lang = 'id-ID';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      document.getElementById('status').textContent = 'Merekam... bicara sekarang.';
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
      document.getElementById('btnSend').disabled = true;
    };

    recognition.onresult = (event) => {
      let interim = '';
      let fin = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) fin += t;
        else interim += t;
      }
      if (fin) {
        finalText = (finalText ? finalText + ' ' : '') + fin;
        document.getElementById('transcript').value = finalText + (interim ? ' ' + interim : '');
      } else {
        document.getElementById('transcript').value = finalText + (interim ? ' ' + interim : '');
      }
      document.getElementById('status').textContent = interim ? 'Mendengar: ' + interim : 'Suara ditangkap.';
    };

    recognition.onerror = (e) => {
      document.getElementById('status').textContent = 'Error: ' + e.error;
      stopRec();
    };

    recognition.onend = () => {
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      if (finalText) document.getElementById('btnSend').disabled = false;
    };

    return true;
  }

  function startRec() {
    if (!recognition && !init()) return;
    try {
      finalText = '';
      document.getElementById('transcript').value = '';
      recognition.start();
    } catch (e) {
      document.getElementById('status').textContent = 'Gagal memulai: ' + e.message;
    }
  }

  function stopRec() {
    if (recognition) recognition.stop();
  }

  async function copyToClipboard() {
    const text = document.getElementById('transcript').value.trim();
    if (!text) {
      document.getElementById('status').textContent = 'Teks kosong.';
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById('status').textContent = '✓ Teks disalin ke clipboard! Tempel di halaman SPEAK UP utama.';
      document.getElementById('btnSend').textContent = '✓ Disalin';
      setTimeout(() => { document.getElementById('btnSend').textContent = 'Kirim ke SPEAK UP'; }, 2000);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        document.getElementById('status').textContent = 'Teks disalin (fallback).';
      } catch (e2) {
        document.getElementById('status').textContent = 'Gagal menyalin.';
      }
      document.body.removeChild(ta);
    }
  }
</script>
</body>
</html>
